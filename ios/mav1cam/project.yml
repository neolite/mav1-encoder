name: mav1cam
options:
  bundleIdPrefix: com.mav1
targets:
  mav1cam:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: mav1cam
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.mav1.mav1cam
      INFOPLIST_KEY_CFBundleDisplayName: mav1cam
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
      INFOPLIST_KEY_NSCameraUsageDescription: "Records video to encode it as AV1"
      INFOPLIST_KEY_UIFileSharingEnabled: YES
      INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
      SWIFT_OBJC_BRIDGING_HEADER: mav1cam/Bridging.h
      HEADER_SEARCH_PATHS: $(SRCROOT)/../../src
      LIBRARY_SEARCH_PATHS: $(SRCROOT)/../../build/ios-$(PLATFORM_NAME)
      OTHER_LDFLAGS: -lmav1
      TARGETED_DEVICE_FAMILY: 1
      IPHONEOS_DEPLOYMENT_TARGET: 17.0
      GENERATE_INFOPLIST_FILE: YES
      DEVELOPMENT_TEAM: ""
